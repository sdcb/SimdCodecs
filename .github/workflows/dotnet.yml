name: CI/CD

on:
  push:
    branches: [ main ]
    # Pushing a version tag (e.g. v1.2.3) publishes to NuGet; branch pushes only build and test.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_CONF: Release
  # The build job CAPTURES a dotnet invocation's stdout to resolve the version, so
  # the SDK's first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Resolve version
      run: |
        if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
            echo "::error::Tag must be a version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          CORE_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          PRERELEASE="${BASH_REMATCH[5]}"
          IFS='.' read -r -a identifiers <<< "$PRERELEASE"
          for identifier in "${identifiers[@]}"; do
            if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
              echo "::error::Numeric prerelease identifiers must not have leading zeroes"
              exit 1
            fi
          done
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FILE_VERSION=${CORE_VERSION}.0" >> "$GITHUB_ENV"
        else
          MM="$(dotnet msbuild Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
          case "$MM" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::VersionMajorMinor did not resolve from Directory.Build.props (got '$MM')"; exit 1 ;;
          esac
          echo "BUILD_VERSION=${MM}.${GITHUB_RUN_NUMBER}${GITHUB_RUN_ATTEMPT}+${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FILE_VERSION=${MM}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
        fi
    # jbig2dec is the reference JBIG2 decoder that Jbig2OracleTests checks our
    # codestreams against. Used strictly as a BINARY -- it is AGPL and can never
    # be a port source for this repo (see AGENTS.md and
    # tests/Sdcb.SimdCodecs.Tests/Oracle/jbig2/README.md).
    #
    # webp brings dwebp and anim_dump, the libwebp reference tools that the live
    # WebP comparisons (WebpOracleTests / WebpAnimationOracleTests) run against.
    # Binary only, like the rest: Sdcb.SimdCodecs.Webp is spec-derived from RFC 6386 /
    # RFC 9649. Ubuntu's build is older than the libwebp 1.6.0 the committed digests
    # were made with; the two agree on every fixture, and a disagreement between
    # them would be worth knowing about rather than pinning away.
    - name: Install codec oracles
      run: sudo apt-get update && sudo apt-get install -y jbig2dec webp
    # OpenJPEG's opj_compress / opj_decompress, the JPEG 2000 reference tools.
    # Downloaded rather than built: OpenJPEG wants CMake, and upstream publishes
    # official builds for both platforms that matter, so this runner and the dev
    # box execute the SAME BYTES rather than merely the same source. Pinned by
    # version and SHA-256 in the script. Deliberately NOT `apt-get install
    # libopenjp2-tools`, which is 2.4.0 on jammy and 2.5.x on noble -- CI and the
    # dev box would then quietly disagree about what the reference is.
    - name: Fetch JPEG 2000 oracle (OpenJPEG)
      run: bash tests/Sdcb.SimdCodecs.Tests/Oracle/jpeg2000/fetch.sh
    - name: Restore dependencies
      run: dotnet restore SimdCodecs.slnx
    - name: Build
      run: dotnet build SimdCodecs.slnx -c "$BUILD_CONF" --no-restore -p:Version="$BUILD_VERSION" -p:FileVersion="$FILE_VERSION" -p:ContinuousIntegrationBuild=true
    - name: Test
      # REQUIRE_ORACLES turns "oracle missing" from a skip into a failure. Every
      # oracle harness degrades to a skip so a clean clone stays green, which is
      # right locally and misleading here -- without this, a CI job that stopped
      # installing jbig2dec or building an oracle would look exactly like one
      # that did. All three external oracles (jbig2dec, OpenJPEG
      # and libwebp's dwebp / anim_dump) are gated and fetched or built above,
      # so this run has no silently-absent oracle left.
      env:
        REQUIRE_ORACLES: 1
      run: dotnet test SimdCodecs.slnx -c $BUILD_CONF --no-build
    - name: Test JPEG on forced ISA fallbacks
      # The JPEG kernels dispatch Vector256 (AVX2) -> Vector128 -> scalar and must be
      # bit-identical on every tier; the golden digests only see the tier this runner
      # dispatches to. DOTNET_EnableAVX2=0 forces the Vector128 kernels,
      # DOTNET_EnableHWIntrinsic=0 the scalar ones.
      run: |
        DOTNET_EnableAVX2=0 dotnet test tests/Sdcb.SimdCodecs.Tests -c $BUILD_CONF --no-build --filter "FullyQualifiedName~Jpeg"
        DOTNET_EnableHWIntrinsic=0 dotnet test tests/Sdcb.SimdCodecs.Tests -c $BUILD_CONF --no-build --filter "FullyQualifiedName~Jpeg"
    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  jpeg-arm64:
    # Vector128 maps to AdvSimd here: the same bit-exact contract on another ISA.
    # No external oracles on this runner, so oracle tests skip (no REQUIRE_ORACLES).
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
    - name: Test JPEG (arm64)
      run: dotnet test tests/Sdcb.SimdCodecs.Tests -c Release --filter "FullyQualifiedName~Jpeg"

  jpeg-aot:
    # NativeAOT picks the vector tier at compile time: its decodes must equal the JIT's.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: NativeAOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: NativeAOT smoke test
      run: bash tests/Sdcb.SimdCodecs.AotSmoke/run.sh

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
    - name: NuGet login
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USER }}
    - name: Push NuGet package
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push **/*.nupkg -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY"
